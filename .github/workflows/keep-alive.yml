name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spin-down (15 min idle timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          echo "Pinging backend at $(date -u)"
          curl -fsS --max-time 60 --retry 3 --retry-delay 10 \
            "https://tripzy-backend-3ftn.onrender.com/health" \
            && echo " ✅ Backend is alive" \
            || echo " ⚠️ Backend did not respond (may be waking up)"
